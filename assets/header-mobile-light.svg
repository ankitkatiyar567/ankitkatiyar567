<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-label="Ankit Katiyar, Applied AI Engineer at Vaisala: automating the whole software pipeline with AI agents, 24x7">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1ECFF"/></linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="682" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".6" stop-color="#8B5CF6"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <radialGradient id="glow" cx=".9" cy=".04" r=".7"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#1E1B4B" opacity=".07"/></pattern>
    <clipPath id="round"><rect width="720" height="620" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="720" height="620" fill="url(#bg)"/>
    <rect width="720" height="620" fill="url(#dots)"/>
    <rect width="720" height="620" fill="url(#glow)"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
