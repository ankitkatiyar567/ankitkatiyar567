    <text x="50" y="166" font-size="32" font-weight="600" fill="#6D28D9">Applied AI Engineer @ Vaisala</text>
    <text x="50" y="208" font-size="32" font-weight="600" fill="#6D28D9">automating the whole software pipeline</text>
    <text x="50" y="256" font-size="25" fill="#475569">Software factories · code-review bots</text>
    <text x="50" y="292" font-size="25" fill="#475569">Claude skills, plugins and MCP servers</text>
    <g transform="translate(48 326)">
      <rect width="300" height="48" rx="24" fill="#1E1B4B" fill-opacity=".05" stroke="#1E1B4B" stroke-opacity=".18"/>
      <circle cx="26" cy="24" r="7" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="44" y="32" font-size="22" font-weight="600" fill="#1E293B">pipeline running 24×7</text>
    </g>
    <path d="M96 452 L624 452 C682 452 682 556 624 556 L96 556" fill="none" stroke="url(#flow)" stroke-width="4" stroke-opacity=".6" stroke-linecap="round"/>
    <circle cx="96" cy="452" r="24" fill="#22D3EE" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="96" cy="452" r="14" fill="#FFFFFF" stroke="#22D3EE" stroke-width="4"/><text x="96" y="496" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">Requirement</text><circle cx="272" cy="452" r="24" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="1.18s" repeatCount="indefinite"/></circle><circle cx="272" cy="452" r="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="4"/><text x="272" y="496" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">Plan</text><circle cx="448" cy="452" r="24" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="2.35s" repeatCount="indefinite"/></circle><circle cx="448" cy="452" r="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="4"/><text x="448" y="496" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">Design</text><circle cx="624" cy="452" r="24" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="3.53s" repeatCount="indefinite"/></circle><circle cx="624" cy="452" r="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="4"/><text x="624" y="496" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">Code</text><circle cx="624" cy="556" r="24" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="4.47s" repeatCount="indefinite"/></circle><circle cx="624" cy="556" r="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="4"/><text x="624" y="600" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">Test</text><circle cx="448" cy="556" r="24" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="5.65s" repeatCount="indefinite"/></circle><circle cx="448" cy="556" r="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="4"/><text x="448" y="600" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">Review</text><circle cx="272" cy="556" r="24" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="6.82s" repeatCount="indefinite"/></circle><circle cx="272" cy="556" r="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="4"/><text x="272" y="600" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">Deploy</text><circle cx="96" cy="556" r="24" fill="#34D399" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="8.00s" repeatCount="indefinite"/></circle><circle cx="96" cy="556" r="14" fill="#FFFFFF" stroke="#34D399" stroke-width="4"/><text x="96" y="600" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">Maintain</text>
    <circle r="9" fill="#22D3EE"><animate attributeName="fill" values="#22D3EE;#8B5CF6;#34D399" dur="8.0s" repeatCount="indefinite"/>
      <animateMotion dur="8.0s" repeatCount="indefinite" path="M96 452 L624 452 C682 452 682 556 624 556 L96 556"/></circle>
