<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ankit Katiyar, Applied AI Engineer at Vaisala: automating the whole software pipeline with AI agents, 24x7">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1ECFF"/></linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1120" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <radialGradient id="glow" cx=".88" cy=".05" r=".55"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1E1B4B" opacity=".07"/></pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="58" y="90" font-size="54" font-weight="700" fill="#0F172A">Ankit Katiyar</text>
    <text x="60" y="130" font-size="22" font-weight="600" fill="#6D28D9">Applied AI Engineer @ Vaisala · automating the whole software pipeline</text>
    <text x="60" y="162" font-size="17" fill="#475569">Software factories · code-review bots · Claude skills, plugins and MCP servers</text>
    <g transform="translate(924 52)">
      <rect width="216" height="34" rx="17" fill="#1E1B4B" fill-opacity=".05" stroke="#1E1B4B" stroke-opacity=".18"/>
      <circle cx="20" cy="17" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="34" y="22" font-size="14" font-weight="600" fill="#1E293B">pipeline running 24×7</text>
    </g>
    <line x1="80" y1="238" x2="1120" y2="238" stroke="url(#flow)" stroke-width="3" stroke-opacity=".6" stroke-linecap="round"/>
    <circle cx="80.0" cy="238" r="18" fill="#22D3EE" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="80.0" cy="238" r="11" fill="#FFFFFF" stroke="#22D3EE" stroke-width="3"/><text x="80.0" y="276" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Requirement</text><circle cx="228.6" cy="238" r="18" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="1.14s" repeatCount="indefinite"/></circle><circle cx="228.6" cy="238" r="9" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/><text x="228.6" y="276" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Plan</text><circle cx="377.1" cy="238" r="18" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="2.29s" repeatCount="indefinite"/></circle><circle cx="377.1" cy="238" r="9" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/><text x="377.1" y="276" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Design</text><circle cx="525.7" cy="238" r="18" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="3.43s" repeatCount="indefinite"/></circle><circle cx="525.7" cy="238" r="9" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/><text x="525.7" y="276" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Code</text><circle cx="674.3" cy="238" r="18" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="4.57s" repeatCount="indefinite"/></circle><circle cx="674.3" cy="238" r="9" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/><text x="674.3" y="276" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Test</text><circle cx="822.9" cy="238" r="18" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="5.71s" repeatCount="indefinite"/></circle><circle cx="822.9" cy="238" r="9" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/><text x="822.9" y="276" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Review</text><circle cx="971.4" cy="238" r="18" fill="#8B5CF6" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="6.86s" repeatCount="indefinite"/></circle><circle cx="971.4" cy="238" r="9" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/><text x="971.4" y="276" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Deploy</text><circle cx="1120.0" cy="238" r="18" fill="#34D399" opacity="0"><animate attributeName="opacity" values=".55;0;0" keyTimes="0;.12;1" dur="8.0s" begin="8.00s" repeatCount="indefinite"/></circle><circle cx="1120.0" cy="238" r="11" fill="#FFFFFF" stroke="#34D399" stroke-width="3"/><text x="1120.0" y="276" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Maintain</text>
    <circle r="7" fill="#22D3EE"><animate attributeName="fill" values="#22D3EE;#8B5CF6;#34D399" dur="8.0s" repeatCount="indefinite"/>
      <animateMotion dur="8.0s" repeatCount="indefinite" path="M80 238 L1120 238"/></circle>
  </g>
